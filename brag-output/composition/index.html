<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { position: relative; width: 100%; height: 100%; background: #0b0d10; }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <!--
      Mobile Remote - /brag launch film.
      Scene cuts sit on the beat grid of the music bed (109.96 BPM):
      0 / 2.46 / 5.74 / 9.29 / 13.11 / 16.38 / 20.19.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.19"
      data-width="1920"
      data-height="1080"
    >
      <div class="clip" id="scene-1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0"     data-duration="2.46" data-track-index="0"></div>
      <div class="clip" id="scene-2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="2.46"  data-duration="3.28" data-track-index="1"></div>
      <div class="clip" id="scene-3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="5.74"  data-duration="3.55" data-track-index="2"></div>
      <div class="clip" id="scene-4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="9.29"  data-duration="3.82" data-track-index="3"></div>
      <div class="clip" id="scene-5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="13.11" data-duration="3.27" data-track-index="4"></div>
      <div class="clip" id="scene-6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="16.38" data-duration="3.81" data-track-index="5"></div>
    </div>

    <!-- ===================== AUDIO =====================
         Music: one track, split at the logo cut so the bed can lift without a
         volume lane. data-media-start keeps playback continuous across the seam. -->
    <audio id="music-a" src="assets/music/music.mp3" data-start="0" data-duration="2.46"
           data-media-start="0" data-volume="0.30" data-fade-in="0.5" data-track-index="8"></audio>
    <audio id="music-b" src="assets/music/music.mp3" data-start="2.46" data-duration="17.73"
           data-media-start="2.46" data-volume="0.60" data-fade-out="1.09" data-track-index="8"></audio>

    <!-- every effect is tied to something visibly moving -->
    <audio id="sfx-drop"    src="assets/sfx/interface/glitch_002.ogg"        data-start="1.64"  data-duration="0.03" data-volume="0.34" data-track-index="9"></audio>
    <audio id="sfx-logo"    src="assets/sfx/impact/impactSoft_medium_000.ogg" data-start="2.46" data-duration="0.12" data-volume="0.5"  data-track-index="9"></audio>
    <!-- beat-grid (eighths): PIN digits at 6.28 / 6.55 / 6.82 / 7.09 -->
    <audio id="sfx-k1"      src="assets/sfx/keyboard/keypress-004.wav"       data-start="6.28"  data-duration="0.25" data-volume="0.42" data-track-index="9"></audio>
    <audio id="sfx-k2"      src="assets/sfx/keyboard/keypress-019.wav"       data-start="6.55"  data-duration="0.25" data-volume="0.42" data-track-index="9"></audio>
    <audio id="sfx-k3"      src="assets/sfx/keyboard/keypress-011.wav"       data-start="6.82"  data-duration="0.25" data-volume="0.42" data-track-index="9"></audio>
    <audio id="sfx-k4"      src="assets/sfx/keyboard/keypress-027.wav"       data-start="7.09"  data-duration="0.25" data-volume="0.42" data-track-index="9"></audio>
    <audio id="sfx-connect" src="assets/sfx/interface/click_003.ogg"         data-start="7.12"  data-duration="0.01"  data-volume="0.5"  data-track-index="10"></audio>
    <audio id="sfx-pad"     src="assets/sfx/ui/rollover1.ogg"                data-start="7.75"  data-duration="0.23"  data-volume="0.3"  data-track-index="9"></audio>
    <audio id="sfx-rotate"  src="assets/sfx/casino/card-slide-1.ogg"         data-start="9.29"  data-duration="0.6"  data-volume="0.4"  data-track-index="9"></audio>
    <audio id="sfx-tap"     src="assets/sfx/ui/mouseclick1.ogg"              data-start="11"    data-duration="0.06"  data-volume="0.4"  data-track-index="9"></audio>
    <!-- beat-grid: cards at 13.11 / 13.64 / 14.20 / 14.73, descending volume -->
    <audio id="sfx-c1"      src="assets/sfx/impact/impactSoft_medium_003.ogg" data-start="13.11" data-duration="0.14" data-volume="0.42" data-track-index="9"></audio>
    <audio id="sfx-c2"      src="assets/sfx/impact/impactSoft_medium_003.ogg" data-start="13.64" data-duration="0.14" data-volume="0.36" data-track-index="9"></audio>
    <audio id="sfx-c3"      src="assets/sfx/impact/impactSoft_medium_003.ogg" data-start="14.2"  data-duration="0.14" data-volume="0.31" data-track-index="9"></audio>
    <audio id="sfx-c4"      src="assets/sfx/impact/impactSoft_medium_003.ogg" data-start="14.73" data-duration="0.14" data-volume="0.27" data-track-index="9"></audio>
    <audio id="sfx-outro"   src="assets/sfx/impact/impactSoft_medium_002.ogg" data-start="16.38" data-duration="0.14" data-volume="0.35" data-track-index="9"></audio>

    <script>
      // The root holds only scene hosts and audio; each scene owns its own timeline.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Space Grotesk is not a bundled family, so it loads from assets/. */
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/SpaceGrotesk.ttf") format("truetype");
        font-weight: 400 700;
        font-style: normal;
      }
      /* Palette lifted verbatim from app/lib/theme.dart */
      :root {
        --ground: #0b0d10; --surface: #101418; --surface2: #14181d; --surface3: #0f1317;
        --line: #1f252c; --line2: #262d35;
        --ink: #e8ecf1; --ink2: #c9d1da; --ink3: #8b95a2; --muted: #6b7684; --dim: #4a5461;
        --accent: #5ee0ff; --ok: #7dffb0; --danger: #ff6b6b; --amber: #ffd166; --grid: #1c2229;
        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 1920px; height: 1080px;
        background: var(--ground); font-family: var(--font-display); color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .center-col {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .label {
        font-family: var(--font-mono); font-size: 15px; letter-spacing: 1.6px;
        color: var(--dim); text-transform: uppercase;
      }
      .dotgrid {
        background-image: radial-gradient(var(--grid) 1.6px, transparent 1.6px);
        background-size: 22px 22px;
      }
      .glow {
        position: absolute; left: 50%; top: 50%;
        width: 900px; height: 900px; margin: -450px 0 0 -450px;
        background: radial-gradient(circle, rgba(94,224,255,0.17) 0%, rgba(94,224,255,0) 62%);
      }
      .glow > i { display: block; width: 100%; height: 100%; opacity: 0; }
      .wordmark { font-size: 54px; font-weight: 700; letter-spacing: 0.2em; color: var(--ink); opacity: 0; }
      .spec { font-size: 46px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); opacity: 0; }
      #s6-repo { font-family: var(--font-mono); font-size: 30px; color: var(--accent); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s6" data-width="1920" data-height="1080" data-duration="3.81">
      <div class="glow"><i id="s6-glow"></i></div>
      <div class="center-col">
        <img id="s6-mark" src="assets/img/logo.png" alt="Mobile Remote" style="width: 132px; opacity: 0" />
        <div id="s6-word" class="wordmark" style="margin-top: 24px; font-size: 38px">MOBILE REMOTE</div>
        <div id="s6-l1" class="spec" style="margin-top: 44px">One Python file on the PC.</div>
        <div id="s6-l2" class="spec" style="margin-top: 14px">A 16 MB app on the phone.</div>
        <div id="s6-repo" style="margin-top: 38px">github.com/Asif-Uchchas/pc-remote</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s6-mark", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 0);
      tl.fromTo("#s6-glow", { opacity: 0 }, { opacity: 0.85, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#s6-word", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.22);
      tl.fromTo("#s6-l1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 0.55);
      tl.fromTo("#s6-l2", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 1.09);
      // beat-locked: abs 18.01s (strongCue 0.97) - the repo line lands on the hit
      tl.fromTo("#s6-repo", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 1.63);
      tl.to("#s6-glow", { opacity: 0.4, duration: 1.09, ease: "power2.inOut" }, 2.72);

      // Beat-driven glow (109.96 BPM grid, local times).
      [0, 0.55, 1.09, 1.63, 2.17].forEach(function (t) {
        tl.to("#s6-glow", { scale: 1.035, duration: 0.1, ease: "power2.out" }, t);
        tl.to("#s6-glow", { scale: 1, duration: 0.38, ease: "power2.out" }, t + 0.1);
      });
      window.__timelines["s6"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

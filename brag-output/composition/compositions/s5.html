<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Space Grotesk is not a bundled family, so it loads from assets/. */
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/SpaceGrotesk.ttf") format("truetype");
        font-weight: 400 700;
        font-style: normal;
      }
      /* Palette lifted verbatim from app/lib/theme.dart */
      :root {
        --ground: #0b0d10; --surface: #101418; --surface2: #14181d; --surface3: #0f1317;
        --line: #1f252c; --line2: #262d35;
        --ink: #e8ecf1; --ink2: #c9d1da; --ink3: #8b95a2; --muted: #6b7684; --dim: #4a5461;
        --accent: #5ee0ff; --ok: #7dffb0; --danger: #ff6b6b; --amber: #ffd166; --grid: #1c2229;
        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 1920px; height: 1080px;
        background: var(--ground); font-family: var(--font-display); color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .center-col {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .label {
        font-family: var(--font-mono); font-size: 15px; letter-spacing: 1.6px;
        color: var(--dim); text-transform: uppercase;
      }
      .dotgrid {
        background-image: radial-gradient(var(--grid) 1.6px, transparent 1.6px);
        background-size: 22px 22px;
      }
      #s5-row { display: flex; gap: 34px; }
      .card {
        width: 424px; height: 304px; border-radius: 20px;
        background: var(--surface); border: 1px solid var(--line2);
        padding: 32px; display: flex; flex-direction: column; opacity: 0;
      }
      .card .ci { color: var(--accent); }
      .card .ct { font-size: 30px; font-weight: 700; letter-spacing: -0.015em; margin-top: auto; }
      .card .cs { font-family: var(--font-mono); font-size: 28px; color: var(--ink3); margin-top: 12px; line-height: 1.3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s5" data-width="1920" data-height="1080" data-duration="3.27">
      <div class="center-col">
        <div id="s5-row">
          <div class="card" id="s5-c1">
            <span class="ci"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="2"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"></rect></svg></span>
            <span class="ct">Apps &amp; macros</span>
            <span class="cs">launch any app</span>
          </div>
          <div class="card" id="s5-c2">
            <span class="ci"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"></rect><path d="M5 15V5a2 2 0 012-2h10"></path></svg></span>
            <span class="ct">Clipboard &amp; files</span>
            <span class="cs">both directions</span>
          </div>
          <div class="card" id="s5-c3">
            <span class="ci"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4z"></path><path d="M17.5 9.5a4 4 0 010 5M20.5 7a7.5 7.5 0 010 10"></path></svg></span>
            <span class="ct">Volume &amp; now playing</span>
            <span class="cs">the real PC volume</span>
          </div>
          <div class="card" id="s5-c4">
            <span class="ci"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11h4M9 9v4"></path><circle cx="15.5" cy="10.5" r="1"></circle><circle cx="17.5" cy="13" r="1"></circle><path d="M7.5 7h9a4.5 4.5 0 014.4 3.6l.8 4a3.4 3.4 0 01-6.1 2.6L14.8 16H9.2l-.8 1.2a3.4 3.4 0 01-6.1-2.6l.8-4A4.5 4.5 0 017.5 7z"></path></svg></span>
            <span class="ct">Gamepad</span>
            <span class="cs">a virtual Xbox pad</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // beat-grid: cards at abs 13.11 / 13.64 / 14.20 / 14.73; the full set then holds 1.65s
      ["#s5-c1", "#s5-c2", "#s5-c3", "#s5-c4"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0, y: 40, scale: 0.965 },
          { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "power3.out" },
          [0, 0.53, 1.09, 1.62][i]
        );
      });
      // beat-locked: abs 15.82s (strongCue 1.00) - the set settles together on the hit
      tl.to("#s5-row", { scale: 1.014, duration: 0.14, ease: "power2.out" }, 2.71);
      tl.to("#s5-row", { scale: 1, duration: 0.34, ease: "power2.inOut" }, 2.85);
      window.__timelines["s5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

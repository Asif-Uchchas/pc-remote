<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Space Grotesk is not a bundled family, so it loads from assets/. */
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/SpaceGrotesk.ttf") format("truetype");
        font-weight: 400 700;
        font-style: normal;
      }
      /* Palette lifted verbatim from app/lib/theme.dart */
      :root {
        --ground: #0b0d10; --surface: #101418; --surface2: #14181d; --surface3: #0f1317;
        --line: #1f252c; --line2: #262d35;
        --ink: #e8ecf1; --ink2: #c9d1da; --ink3: #8b95a2; --muted: #6b7684; --dim: #4a5461;
        --accent: #5ee0ff; --ok: #7dffb0; --danger: #ff6b6b; --amber: #ffd166; --grid: #1c2229;
        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 1920px; height: 1080px;
        background: var(--ground); font-family: var(--font-display); color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .center-col {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .label {
        font-family: var(--font-mono); font-size: 15px; letter-spacing: 1.6px;
        color: var(--dim); text-transform: uppercase;
      }
      .dotgrid {
        background-image: radial-gradient(var(--grid) 1.6px, transparent 1.6px);
        background-size: 22px 22px;
      }
      .phone {
        width: 372px; height: 788px; border-radius: 46px;
        background: var(--ground); border: 2px solid var(--line2);
        padding: 16px; position: relative; overflow: hidden;
        box-shadow: 0 40px 90px rgba(0,0,0,0.55);
      }
      .phone-screen { position: absolute; inset: 16px; border-radius: 32px; background: var(--ground); overflow: hidden; }
      .screen-pane { position: absolute; inset: 0; padding: 26px 20px; }
      .finger {
        position: absolute; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px;
        border-radius: 50%; background: rgba(94,224,255,0.22); border: 2px solid var(--accent); opacity: 0;
      }
      .desktop {
        border-radius: 16px; overflow: hidden; position: relative;
        background: linear-gradient(160deg, #182333 0%, #0e1622 100%);
        border: 1px solid var(--line2);
      }
      .win { position: absolute; border-radius: 7px; border: 1px solid #34404f; background: #212b38; overflow: hidden; }
      .win .bar { height: 24px; background: #34404f; display: flex; align-items: center; gap: 6px; padding: 0 9px; }
      .win .bar i { width: 8px; height: 8px; border-radius: 50%; background: #56637a; display: block; }
      .win .body { padding: 12px; }
      .win .body u { display: block; height: 7px; border-radius: 4px; background: #2e3a49; margin-bottom: 9px; text-decoration: none; }
      .taskbar {
        position: absolute; left: 0; right: 0; bottom: 0; height: 42px; background: #0a0f16;
        display: flex; align-items: center; justify-content: center; gap: 10px;
      }
      .taskbar i { width: 11px; height: 11px; border-radius: 3px; background: #3a4656; display: block; }
      .cursor { position: absolute; left: 0; top: 0; opacity: 0; }
      .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px; color: var(--accent); }
      .h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-top: 8px; }
      .sub { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
      .pcrow {
        margin-top: 20px; height: 70px; border-radius: 13px;
        background: var(--surface2); border: 1px solid var(--line2);
        display: flex; align-items: center; gap: 12px; padding: 0 12px; opacity: 0;
      }
      .pcrow .ico {
        width: 42px; height: 42px; border-radius: 11px; flex: none;
        background: var(--surface); border: 1px solid var(--line);
        display: flex; align-items: center; justify-content: center;
      }
      .pcrow .nm { font-size: 15px; font-weight: 600; }
      .pcrow .ip { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
      .pcrow .chk { margin-left: auto; opacity: 0; }
      .pinrow { display: flex; gap: 9px; margin-top: 22px; }
      .pinbox {
        flex: 1; height: 58px; border-radius: 13px; background: var(--surface2); border: 1px solid var(--line2);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-mono); font-size: 23px; color: var(--dim);
      }
      .pinbox b { font-weight: 400; color: var(--ink); opacity: 0; }
      .cta {
        margin-top: 20px; height: 56px; border-radius: 13px; background: var(--accent); color: var(--ground);
        display: flex; align-items: center; justify-content: center; gap: 9px;
        font-size: 14px; font-weight: 700; letter-spacing: 0.05em;
      }
      .padsurface {
        position: absolute; left: 20px; right: 20px; top: 26px; bottom: 150px;
        border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
      }
      .padsurface .lbl { position: absolute; top: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.3px; color: var(--dim); }
      .padhint {
        position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
        font-family: var(--font-mono); font-size: 11px; line-height: 1.6; color: var(--dim);
      }
      .mousebtns { position: absolute; left: 20px; right: 20px; bottom: 86px; display: flex; gap: 9px; }
      .mousebtns div {
        height: 52px; border-radius: 13px; background: var(--surface2); border: 1px solid var(--line2);
        display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
      }
      .keystrip { position: absolute; left: 20px; right: 20px; bottom: 22px; display: flex; gap: 7px; overflow: hidden; }
      .keystrip div {
        height: 46px; padding: 0 14px; border-radius: 11px; background: var(--surface3); border: 1px solid var(--line2);
        display: flex; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--ink2); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s3" data-width="1920" data-height="1080" data-duration="3.55">
      <div style="position: absolute; left: 228px; top: 146px">
        <div id="s3-phone" class="phone" style="opacity: 0">
          <div class="phone-screen">
            <div id="s3-connect" class="screen-pane" data-layout-ignore>
              <div class="eyebrow">MOBILE REMOTE</div>
              <div class="h1">Pick a PC</div>
              <div class="sub">Phone and PC on the same Wi&#8209;Fi.</div>
              <div style="margin-top: 22px" class="label">ON YOUR NETWORK</div>
              <div id="s3-pcrow" class="pcrow">
                <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5ee0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span>
                <span>
                  <span class="nm">STUDIO-PC</span>
                  <span class="ip" style="display: block">192.168.1.24:48889</span>
                </span>
                <span id="s3-chk" class="chk"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5ee0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.4l2.6 2.6L16 9.6"></path></svg></span>
              </div>
              <div style="margin-top: 26px" class="label">PIN</div>
              <div class="pinrow">
                <div class="pinbox">&middot;<b id="s3-p1">4</b></div>
                <div class="pinbox">&middot;<b id="s3-p2">8</b></div>
                <div class="pinbox">&middot;<b id="s3-p3">2</b></div>
                <div class="pinbox">&middot;<b id="s3-p4">1</b></div>
              </div>
              <div id="s3-cta" class="cta">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0b0d10" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"></path></svg>
                CONNECT TO STUDIO-PC
              </div>
            </div>
            <div id="s3-pad" class="screen-pane" style="opacity: 0" data-layout-ignore>
              <div class="padsurface dotgrid">
                <span class="lbl" style="left: 14px">TRACKPAD</span>
                <span class="lbl" style="right: 14px">2.5&times;</span>
                <div class="padhint">tap &middot; click<br />2 fingers &middot; right / scroll</div>
                <div id="s3-finger" class="finger"></div>
              </div>
              <div class="mousebtns">
                <div style="flex: 3">LEFT</div>
                <div style="flex: 2; color: var(--ink3)">MID</div>
                <div style="flex: 3">RIGHT</div>
              </div>
              <div class="keystrip"><div>ESC</div><div>TAB</div><div>&#9003;</div><div>ENTER</div><div>CTRL+C</div></div>
            </div>
          </div>
        </div>
      </div>

      <div style="position: absolute; left: 718px; top: 232px">
        <div id="s3-desk" class="desktop" style="width: 1030px; height: 616px; opacity: 0.45">
          <div class="win" style="left: 7%; top: 11%; width: 54%; height: 56%">
            <div class="bar"><i></i><i></i><i></i></div>
            <div class="body"><u style="width: 72%"></u><u style="width: 55%"></u><u style="width: 81%"></u><u style="width: 44%"></u><u style="width: 66%"></u></div>
          </div>
          <div class="win" style="left: 42%; top: 30%; width: 48%; height: 52%">
            <div class="bar"><i></i><i></i><i></i></div>
            <div class="body"><u style="width: 58%"></u><u style="width: 77%"></u><u style="width: 39%"></u><u style="width: 64%"></u></div>
          </div>
          <div class="taskbar"><i></i><i></i><i style="background: #5ee0ff"></i><i></i><i></i></div>
          <div id="s3-cursor" class="cursor"><svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff" stroke="#0b0d10" stroke-width="1.1"><path d="M5 3l14 8-7 1-4 7z"></path></svg></div>
        </div>
      </div>

      <div id="s3-label" class="label" style="position: absolute; left: 228px; top: 960px; font-size: 30px; letter-spacing: 2px; color: var(--ink3); opacity: 0">
        trackpad &middot; keyboard &middot; media keys
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s3-phone", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0);
      tl.fromTo("#s3-pcrow", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.21);
      tl.fromTo("#s3-chk", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.2)" }, 0.38);
      // beat-grid (eighths): PIN digits at abs 6.28 / 6.55 / 6.82 / 7.09
      ["#s3-p1", "#s3-p2", "#s3-p3", "#s3-p4"].forEach(function (sel, i) {
        tl.fromTo(sel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, 0.54 + i * 0.27);
      });
      tl.to("#s3-cta", { scale: 0.965, duration: 0.09, ease: "power2.inOut" }, 1.38);
      tl.to("#s3-cta", { scale: 1, duration: 0.16, ease: "power2.out" }, 1.47);
      tl.to("#s3-desk", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.38);
      tl.to("#s3-connect", { opacity: 0, x: -46, duration: 0.3, ease: "power2.inOut" }, 1.61);
      tl.fromTo("#s3-pad", { opacity: 0, x: 56 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 1.64);
      tl.fromTo("#s3-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.76);
      // the finger drives the pad; the desktop cursor moves in step
      tl.set("#s3-finger", { x: 96, y: 212 }, 1.96);
      tl.set("#s3-cursor", { x: 250, y: 300 }, 1.96);
      tl.to("#s3-finger", { opacity: 1, duration: 0.14 }, 2.01);
      tl.to("#s3-cursor", { opacity: 1, duration: 0.14 }, 2.01);
      tl.to("#s3-finger", { x: 232, y: 352, duration: 1.3, ease: "power1.inOut" }, 2.1);
      tl.to("#s3-cursor", { x: 596, y: 470, duration: 1.3, ease: "power1.inOut" }, 2.1);
      tl.to("#s3-finger", { opacity: 0, duration: 0.2 }, 3.34);
      window.__timelines["s3"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

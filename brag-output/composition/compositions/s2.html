<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Space Grotesk is not a bundled family, so it loads from assets/. */
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/SpaceGrotesk.ttf") format("truetype");
        font-weight: 400 700;
        font-style: normal;
      }
      /* Palette lifted verbatim from app/lib/theme.dart */
      :root {
        --ground: #0b0d10; --surface: #101418; --surface2: #14181d; --surface3: #0f1317;
        --line: #1f252c; --line2: #262d35;
        --ink: #e8ecf1; --ink2: #c9d1da; --ink3: #8b95a2; --muted: #6b7684; --dim: #4a5461;
        --accent: #5ee0ff; --ok: #7dffb0; --danger: #ff6b6b; --amber: #ffd166; --grid: #1c2229;
        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 1920px; height: 1080px;
        background: var(--ground); font-family: var(--font-display); color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .center-col {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .label {
        font-family: var(--font-mono); font-size: 15px; letter-spacing: 1.6px;
        color: var(--dim); text-transform: uppercase;
      }
      .dotgrid {
        background-image: radial-gradient(var(--grid) 1.6px, transparent 1.6px);
        background-size: 22px 22px;
      }
      .glow {
        position: absolute; left: 50%; top: 50%;
        width: 900px; height: 900px; margin: -450px 0 0 -450px;
        background: radial-gradient(circle, rgba(94,224,255,0.17) 0%, rgba(94,224,255,0) 62%);
      }
      .glow > i { display: block; width: 100%; height: 100%; opacity: 0; }
      .wordmark { font-size: 54px; font-weight: 700; letter-spacing: 0.2em; color: var(--ink); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s2" data-width="1920" data-height="1080" data-duration="3.28">
      <div class="glow"><i id="s2-glow"></i></div>
      <div class="center-col">
        <img id="s2-mark" src="assets/img/logo.png" alt="Mobile Remote" style="width: 226px; opacity: 0" />
        <div id="s2-word" class="wordmark" style="margin-top: 30px">MOBILE REMOTE</div>
        <div id="s2-tag" style="margin-top: 26px; font-size: 35px; font-weight: 600; color: var(--accent); opacity: 0">
          Your phone is the trackpad now.
        </div>
        <div id="s2-sub" style="margin-top: 16px; font-family: var(--font-mono); font-size: 30px; color: var(--ink3); opacity: 0">
          Wi-Fi. No pairing.
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s2-mark", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#s2-glow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#s2-word", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.55);
      tl.fromTo("#s2-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 1.09);
      tl.fromTo("#s2-sub", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power2.out" }, 1.44);

      // Beat-driven glow (109.96 BPM grid, local times). True RMS extraction was
      // unavailable, so the brand glow breathes on the music's own beat grid.
      [0, 0.55, 1.09, 1.64, 2.18, 2.73].forEach(function (t) {
        tl.to("#s2-glow", { scale: 1.045, duration: 0.1, ease: "power2.out" }, t);
        tl.to("#s2-glow", { scale: 1, duration: 0.38, ease: "power2.out" }, t + 0.1);
      });
      window.__timelines["s2"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

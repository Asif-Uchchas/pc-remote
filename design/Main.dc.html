<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0b0d10; font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    a { color: #5ee0ff; } a:hover { color: #9eecff; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0b0d10; color: #e8ecf1; display: flex; flex-direction: column; box-sizing: border-box; padding: 56px 16px 20px 16px; gap: 12px; font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #5ee0ff; box-shadow: 0 0 10px #5ee0ff;"></div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">JARVIS</div>
        <div style="font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; color: #6b7684;">192.168.0.104 · 3 ms</div>
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #14181d; border: 1px solid #1f252c; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #14181d; border: 1px solid #1f252c; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1da" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h6"></path><circle cx="18" cy="12" r="2"></circle><circle cx="14" cy="17" r="2"></circle></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; border-radius: 16px; background: #101418; border: 1px solid #1f252c; position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; box-sizing: border-box;">
    <div style="position: absolute; inset: 0; background-image: radial-gradient(#1c2229 1px, transparent 1px); background-size: 22px 22px; opacity: 0.7;"></div>
    <div style="position: absolute; top: 14px; left: 14px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; color: #4a5461; letter-spacing: 0.12em;">TRACKPAD</div>
    <div style="position: absolute; top: 14px; right: 14px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; color: #4a5461; letter-spacing: 0.12em;">2.5×</div>
    <div style="position: relative; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; color: #4a5461; text-align: center; line-height: 1.6;">tap · click  ·  2 fingers · right / scroll<br>hold · drag</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="height: 52px; border-radius: 12px; background: #14181d; border: 1px solid #262d35; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #e8ecf1;">LEFT</div>
    <div style="height: 52px; border-radius: 12px; background: #14181d; border: 1px solid #262d35; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #8b95a2;">MID</div>
    <div style="height: 52px; border-radius: 12px; background: #14181d; border: 1px solid #262d35; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #e8ecf1;">RIGHT</div>
  </div>

  <div style="display: flex; gap: 6px; overflow: hidden;">
    <div style="height: 44px; padding: 0 14px; border-radius: 10px; background: #0f1317; border: 1px solid #262d35; display: flex; align-items: center; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; color: #c9d1da;">ESC</div>
    <div style="height: 44px; padding: 0 14px; border-radius: 10px; background: #0f1317; border: 1px solid #262d35; display: flex; align-items: center; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; color: #c9d1da;">TAB</div>
    <div style="height: 44px; padding: 0 14px; border-radius: 10px; background: #0f1317; border: 1px solid #262d35; display: flex; align-items: center; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; color: #c9d1da;">⌫</div>
    <div style="height: 44px; padding: 0 14px; border-radius: 10px; background: #0f1317; border: 1px solid #262d35; display: flex; align-items: center; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; color: #c9d1da;">ENTER</div>
    <div style="height: 44px; padding: 0 14px; border-radius: 10px; background: #0f1317; border: 1px solid #262d35; display: flex; align-items: center; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; color: #c9d1da;">ALT+TAB</div>
    <div style="height: 44px; padding: 0 14px; border-radius: 10px; background: #0f1317; border: 1px solid #262d35; display: flex; align-items: center; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; color: #c9d1da;">CTRL+C</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
    <div style="height: 44px; border-radius: 10px; background: #14181d; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#c9d1da"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"></path></svg></div>
    <div style="height: 44px; border-radius: 10px; background: #5ee0ff; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0b0d10"><path d="M7 5l12 7-12 7z"></path></svg></div>
    <div style="height: 44px; border-radius: 10px; background: #14181d; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#c9d1da"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"></path></svg></div>
    <div style="height: 44px; border-radius: 10px; background: #14181d; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9d1da" stroke-width="2" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10H4zM18 9l4 6M22 9l-4 6"></path></svg></div>
    <div style="height: 44px; border-radius: 10px; background: #14181d; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9d1da" stroke-width="2" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10H4zM17 12h4"></path></svg></div>
    <div style="height: 44px; border-radius: 10px; background: #14181d; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9d1da" stroke-width="2" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10H4zM19 10v4M17 12h4"></path></svg></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding-top: 6px; border-top: 1px solid #1f252c;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5ee0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8-7 1-4 7z"></path></svg><div style="font-size: 10px; font-weight: 600; color: #5ee0ff; letter-spacing: 0.08em;">PAD</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7684" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg><div style="font-size: 10px; font-weight: 600; color: #6b7684; letter-spacing: 0.08em;">KEYS</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7684" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg><div style="font-size: 10px; font-weight: 600; color: #6b7684; letter-spacing: 0.08em;">APPS</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7684" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 17v3"></path></svg><div style="font-size: 10px; font-weight: 600; color: #6b7684; letter-spacing: 0.08em;">SCREEN</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7684" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"></path></svg><div style="font-size: 10px; font-weight: 600; color: #6b7684; letter-spacing: 0.08em;">SHARE</div></div>
  </div>
</div>
</x-dc>
</body>
</html>

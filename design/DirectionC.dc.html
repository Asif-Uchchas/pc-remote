<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #ffffff; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #111111; } a:hover { color: #555555; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #111111; display: flex; flex-direction: column; box-sizing: border-box; padding: 56px 20px 16px 20px; gap: 0; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px; border-bottom: 1.5px solid #111111;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; line-height: 1; letter-spacing: -0.01em;">Jarvis</div>
    <div style="font-size: 12px; color: #111111; display: flex; gap: 14px;">
      <span style="text-decoration: underline; text-underline-offset: 3px;">Keyboard</span>
      <span style="text-decoration: underline; text-underline-offset: 3px;">Settings</span>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; padding: 8px 0; font-size: 11px; color: #777777; letter-spacing: 0.04em; text-transform: uppercase;">
    <span>Connected · 3 ms</span>
    <span>Speed 2.5×</span>
  </div>

  <div style="flex-grow: 1; border: 1.5px solid #111111; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box; position: relative;">
    <div style="position: absolute; top: 12px; left: 16px; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 20px; color: #111111;">Trackpad</div>
    <div style="font-size: 12px; color: #777777; line-height: 1.6;">Tap — click. Two fingers — right-click, scroll.<br>Hold, then move — drag.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-left: 1.5px solid #111111; border-right: 1.5px solid #111111; border-bottom: 1.5px solid #111111;">
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; border-right: 1.5px solid #111111;">Left</div>
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #777777; border-right: 1.5px solid #111111;">Middle</div>
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">Right</div>
  </div>

  <div style="display: flex; gap: 0; overflow: hidden; margin-top: 14px; border-top: 1px solid #dddddd; border-bottom: 1px solid #dddddd;">
    <div style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid #dddddd;">Esc</div>
    <div style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid #dddddd;">Tab</div>
    <div style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid #dddddd;">⌫</div>
    <div style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid #dddddd;">Enter</div>
    <div style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid #dddddd;">Alt+Tab</div>
    <div style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid #dddddd;">Ctrl+C</div>
    <div style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 13px;">Ctrl+V</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 14px;">
    <div style="height: 46px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#111111"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"></path></svg></div>
    <div style="height: 46px; display: flex; align-items: center; justify-content: center; background: #111111;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff"><path d="M7 5l12 7-12 7z"></path></svg></div>
    <div style="height: 46px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#111111"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"></path></svg></div>
    <div style="height: 46px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10H4zM18 9l4 6M22 9l-4 6"></path></svg></div>
    <div style="height: 46px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10H4zM17 12h4"></path></svg></div>
    <div style="height: 46px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10H4zM19 10v4M17 12h4"></path></svg></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 14px; border-top: 1.5px solid #111111; padding-top: 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 17px;">Pad</div><div style="width: 18px; height: 1.5px; background: #111111;"></div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: #777777;">Keys</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: #777777;">Apps</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: #777777;">Screen</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: #777777;">Share</div></div>
  </div>
</div>
</x-dc>
</body>
</html>
